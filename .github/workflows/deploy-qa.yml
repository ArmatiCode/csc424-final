name: Deploy to QA

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/armaticode/csc424-frontend:latest ./frontend
          docker push ghcr.io/armaticode/csc424-frontend:latest

      - name: Build and push backend
        run: |
          docker build -t ghcr.io/armaticode/csc424-backend:latest ./backend
          docker push ghcr.io/armaticode/csc424-backend:latest

      - name: Build and push nginx
        run: |
          docker build -t ghcr.io/armaticode/csc424-nginx:latest ./nginx
          docker push ghcr.io/armaticode/csc424-nginx:latest

      - name: Deploy to QA
        run: |
          docker compose -f docker-compose.qa.yml pull
          docker compose -f docker-compose.qa.yml up -d
